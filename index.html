<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Voice Assistant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #111; color: #eee;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; padding: 32px 16px; gap: 24px;
    }
    h1 { color: #aaa; }
    #socket-btn {
      width: 80px; height: 80px; border-radius: 50%;
      border: 2px solid #555; background: #222; color: #eee;
      font-size: 2rem; cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    #socket-btn.active { background: #8b0000; border-color: #e55; }
    #btn:disabled { opacity: 0.4; cursor: default; }
    #status { font-size: 0.85rem; color: #777; min-height: 1.2em; }
    #meter-wrap { width: 260px; height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
    #meter { height: 100%; width: 0%; background: #4a9; transition: width 0.05s; }
    #transcript-box {
      width: 100%; max-width: 640px; background: #1a1a1a;
      border: 1px solid #333; border-radius: 8px; padding: 16px;
      display: flex; flex-direction: column; gap: 6px;
    }
    #partial { color: #888; font-size: 1rem; min-height: 1.4em; font-style: italic; }
    #finals  { color: #ddd; font-size: 1rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    #clear-btn {
      align-self: flex-end; background: none; border: 1px solid #444;
      color: #666; border-radius: 4px; padding: 2px 10px;
      font-size: 0.78rem; cursor: pointer;
    }
    #clear-btn:hover { color: #aaa; border-color: #666; }
    hr { width: 100%; max-width: 640px; border: none; border-top: 1px solid #333; }
    #tts-row { display: flex; gap: 8px; width: 100%; max-width: 640px; }
    #text-input {
      flex: 1; background: #1a1a1a; border: 1px solid #333; border-radius: 6px;
      color: #eee; padding: 8px 12px; font-size: 0.95rem;
    }
    #send-btn {
      background: #1a3a1a; border: 1px solid #4a9; color: #4a9;
      border-radius: 6px; padding: 8px 18px; font-size: 0.95rem; cursor: pointer;
    }

    #record-btn {
      background: #1a3a1a; border: 1px solid #4a9; color: #4a9;
      border-radius: 6px; padding: 8px 18px; font-size: 0.95rem; cursor: pointer;
    }
    #record-btn.active {
        background: #8b0000;
        border-color: #e55;
    }
    #send-btn:disabled {
        opacity: 0.4;
        cursor: default;
    }
    #tts-status {
        font-size: 0.8rem;
        color: #777;
        min-height: 1.2em;
    }

    #conversation{
        display: block;
        width: 100%;
        height: 50vh;
        overflow-y: scroll;
        /* border: 1px solid #000; */
    }
    .message {
        display: block;
        clear: both;
        margin: 8px 0;
        box-sizing: inherit;
        max-width: 90%;
    }
    .message.user_message{
        float: right;
        margin-right: 10px !important;
        margin-left: auto;
        background-color: #eef;
        color: #000;
        padding: 15px;
        border-radius: 12px;
    }
    .message.assistant_message{
        float: left;
        margin-left: 10px !important;
        margin-right: auto;
        background-color: #6cc;
        color: #000;
        padding: 15px;
        border-radius: 12px;
    }
  </style>
</head>
<body>
  <h1>Voice Assistant</h1>
  <button id="socket-btn" title="Click to connect">&#x23FA;</button>

  <div id="conversation">
  </div>
  <hr/>

  <div id="tts-row">
    <textarea id="text-input" type="text" placeholder=""/></textarea>
    <button id="record-btn">&#127908;</button>
    <button id="send-btn">Send</button>
  </div>
  <div id="status">idle</div>
  <div id="meter-wrap"><div id="meter"></div></div>

<script>
    "use strict";

    // ---- STT ----------------------------------------------------------------
    const socketBtn = document.getElementById('socket-btn');
    const statusEl   = document.getElementById('status');
    const meterEl    = document.getElementById('meter');
    const partialEl  = document.getElementById('partial');
    const textInput  = document.getElementById('text-input');

    let ws = null, audioCtx = null, processor = null, source = null, stream = null;
    let running = false, listening = false;

    function setStatus(msg) {
        statusEl.textContent = msg;
    }
    function updateMeter(rms) {
        meterEl.style.width = Math.min(100, rms * 400) + '%';
    }

    async function startSocket() {
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        running = true;
        socketBtn.classList.add('active');
        socketBtn.textContent = '\u23F9';
        setStatus('connecting…');
        ws = new WebSocket(proto + '//' + location.host + '/ws');
        ws.binaryType = 'arraybuffer';

        ws.onopen  = () => { setStatus('connected'); startHeartbeat(ws); };
        ws.onclose = () => { setStatus('disconnected'); if (running) stopCapture(); };
        ws.onerror = () => { setStatus('websocket error'); if (running) stopCapture(); };
        ws.onmessage = (evt) => {
            if (typeof evt.data === 'string') {
                try {
                    const msg = JSON.parse(evt.data);
                    if (msg.type === 'tts_text')  {
                        add_assistant(msg.detail);
                    }
                    if (msg.type === 'tts_done')  {
                        setStatus('done');
                        sendBtn.disabled = false;
                    }
                    if (msg.type === 'tts_error') {
                        setStatus('error: ' + msg.detail);
                        sendBtn.disabled = false;
                    }
                    if (msg.type === 'partial') {
                        textInput.value = msg.text ? '…' + msg.text : '';
                    } else if (msg.type === 'final') {
                        if (msg.text.trim()) {
                            //finalsEl.textContent += (finalsEl.textContent ? '\n' : '') + msg.text.trim();
                            add_user(msg.text.trim());
                        }
                        textInput.value = '';
                    }
                } catch(_) {}
            } else {
                playPcm16(evt.data);
                setStatus('playing…');
            }
        };
    }

    async function stopSocket(){
        if( listening ){
            stopCapture();
            listening = false;
            recordBtn.classList.remove('active');
        }
        if( ws ){
            stopCapture();
            ws.send(JSON.stringify({ type: 'done' }));
            ws.close();
            ws = null;
        }
        running = false;
        socketBtn.classList.remove('active');
        socketBtn.textContent = "\u23FA";
        updateMeter(0);
        setStatus('idle');
    }

    async function startCapture() {
        stream   = await navigator.mediaDevices.getUserMedia({ audio: {echoCancellation: true}, video: false });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        source   = audioCtx.createMediaStreamSource(stream);

        const processor_node = audioCtx.createScriptProcessor(4096, 1, 1);
        processor = processor_node;
        processor_node.onaudioprocess = (e) => {
            const input = e.inputBuffer.getChannelData(0);
            let sum = 0;
            for (let i = 0; i < input.length; i++) {
                sum += input[i] * input[i];
            }
            updateMeter(Math.sqrt(sum / input.length));

            if (ws && ws.readyState === WebSocket.OPEN) {
                if (!ws._initSent) {
                    ws.send(JSON.stringify({ type: 'init', sampleRate: audioCtx.sampleRate }));
                    ws._initSent = true;
                }
                ws.send(input.buffer.slice(input.byteOffset, input.byteOffset + input.byteLength));
            }
        };
        source.connect(processor_node);
        processor_node.connect(audioCtx.destination);
        setStatus("Listening - speak now");
    }

    function stopCapture() {
        if (processor) { processor.disconnect(); processor = null; }
        if (source)    { source.disconnect();    source    = null; }
        if (stream)    { stream.getTracks().forEach(t => t.stop()); stream = null; }
        if (audioCtx)  { audioCtx.close();       audioCtx  = null; }
        setStatus("Not listening");
    }

    function add_user(message){
        var user_message = document.createElement("div");
        user_message.classList.add("message");
        user_message.classList.add("user_message");
        user_message.appendChild(document.createTextNode(message));
        document.getElementById("conversation").appendChild(user_message);
        document.getElementById("conversation").scrollTop = document.getElementById("conversation").scrollHeight;
        return false;
    }

    function add_assistant(message){
        var assistant_message = document.createElement("div");
        assistant_message.classList.add("message");
        assistant_message.classList.add("assistant_message");
        assistant_message.appendChild(document.createTextNode(message));
        document.getElementById("conversation").appendChild(assistant_message);
        document.getElementById("conversation").scrollTop = document.getElementById("conversation").scrollHeight;
        return false;
    }

    socketBtn.addEventListener('click', async () => {
        if (!running) {
            try { await startSocket(); }
            catch(err) {
                setStatus('error: ' + err.message);
                running = false;
                socketBtn.classList.remove('active');
                socketBtn.textContent = '\u23FA';
            }
        } else {
            stopSocket();
        }
    });

    // Client-side heartbeat example
    function startHeartbeat(socket) {
        const heartbeatInterval = setInterval(() => {
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: 'PING' }));
            } else {
                clearInterval(heartbeatInterval);
            }
        }, 30000); // Send every 30 seconds
    }
    // ---- TTS ----------------------------------------------------------------
    const recordBtn = document.getElementById('record-btn');
    const sendBtn = document.getElementById('send-btn');

    let ttsCtx      = null;
    let ttsNextTime = 0;
    const TTS_SAMPLE_RATE = __TTS_SAMPLE_RATE__; // This value is replaced by the server before sending to the browser

    async function playPcm16(arrayBuffer) {
        if (!ttsCtx || ttsCtx.state === 'closed') {
            ttsCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: TTS_SAMPLE_RATE });
            ttsNextTime = ttsCtx.currentTime + 0.05;
        }
        const int16   = new Int16Array(arrayBuffer);
        const float32 = new Float32Array(int16.length);
        for (let i = 0; i < int16.length; i++) {float32[i] = int16[i] / 32768.0;}
        const buf = ttsCtx.createBuffer(1, float32.length, TTS_SAMPLE_RATE);
        buf.copyToChannel(float32, 0);
        const src = ttsCtx.createBufferSource();
        src.buffer = buf;
        src.connect(ttsCtx.destination);
        const startAt = Math.max(ttsNextTime, ttsCtx.currentTime);
        src.start(startAt);
        ttsNextTime = startAt + buf.duration;
    }

    textInput.addEventListener('keydown', async function(event){
        if(( event.key === 'Enter' )&&( !event.shiftKey )){
            stopPropogation();
            sendInput();
        }
    })

    async function sendInput(){
        const text = textInput.value.trim();
        if (!text) {
            return;
        }
        // sendBtn.disabled = true;
        setStatus('sending…');
        textInput.value = "";
        add_user(text);
        ws.send(JSON.stringify({ type: 'text', text: text }));
    }

    recordBtn.addEventListener('click', async () => {
        if (!listening) {
            try {
                await startCapture();
                listening = true;
                recordBtn.classList.add('active');
            }
            catch(err) {
                setStatus('error: ' + err.message);
                listening = false;
                recordBtn.classList.remove('active');
            }
        } else {
            stopCapture();
            listening = false;
            recordBtn.classList.remove('active');
        }
    });

    sendBtn.addEventListener('click', sendInput );

    window.onload = startSocket();

</script>
</body>
</html>
